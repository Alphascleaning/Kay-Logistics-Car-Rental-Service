<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking – KLCRS</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- ⭐ Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- ⭐ Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- ⭐ Booking Protection (Customers Only) -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const role = localStorage.getItem("klcrsUserRole");
      const email = localStorage.getItem("klcrsUserEmail");

      if (!role || role !== "customer") {
        alert("Please sign up or log in as a customer to book a vehicle.");
        window.location.href = "register.html";
        return;
      }

      // Auto-fill email for logged-in customers
      if (email) {
        document.getElementById("email").value = email;
      }
    });
  </script>

</head>

<body>

<header>
  <div class="logo">KLCRS</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="fleet.html">Fleet</a>
    <a href="booking.html">Booking</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="register.html">Sign Up</a>
    <a href="#" onclick="goAdmin()">Admin</a>
  </nav>
</header>

<h1>Complete Your Booking</h1>

<form id="bookingForm">

  <label>Name:</label>
  <input type="text" id="name" required>

  <label>Phone:</label>
  <input type="text" id="phone" required>

  <label>Email:</label>
  <input type="email" id="email" required>

  <label>Vehicle:</label>
  <select id="vehicle" required>
    <option value="">Select Vehicle</option>
    <option value="ML 320">Mercedes-Benz ML 320</option>
    <option value="Prado">Toyota Land Cruiser Prado</option>
    <option value="X-Trail">Nissan X-Trail</option>
  </select>

  <label>Start Date:</label>
  <input type="date" id="startDate" required>

  <label>End Date:</label>
  <input type="date" id="endDate" required>

  <label>Pickup Location:</label>
  <input type="text" id="pickup" required>

  <label>Driver Option:</label>
  <select id="driver">
    <option value="Self Drive">Self Drive</option>
    <option value="With Driver">With Driver</option>
  </select>

  <button type="submit">Confirm Booking</button>

</form>

<script>
// Auto-fill selected vehicle + date from fleet page
const selectedVehicle = localStorage.getItem("selectedVehicle");
const selectedDate = localStorage.getItem("selectedDate");

if (selectedVehicle) {
  document.getElementById("vehicle").value = selectedVehicle;
}

if (selectedDate) {
  document.getElementById("startDate").value = selectedDate;
}
</script>

<script>
// Submit booking
document.getElementById("bookingForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const vehicle = document.getElementById("vehicle").value;
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;
  const pickup = document.getElementById("pickup").value;
  const driver = document.getElementById("driver").value;

  const bookingData = {
    name, phone, email, vehicle,
    startDate, endDate, pickup, driver
  };

  // Save ALL bookings
  let allBookings = JSON.parse(localStorage.getItem("allBookings")) || [];
  allBookings.push(bookingData);
  localStorage.setItem("allBookings", JSON.stringify(allBookings));

  // Save booked dates into availability
  let availability = JSON.parse(localStorage.getItem("availability")) || {};
  if (!availability[vehicle]) availability[vehicle] = [];

  const start = new Date(startDate);
  const end = new Date(endDate);

  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    availability[vehicle].push(dateStr);
  }

  localStorage.setItem("availability", JSON.stringify(availability));

  // Save last booking for confirmation page
  localStorage.setItem("lastBooking", JSON.stringify(bookingData));

  // Redirect
  window.location.href = "booking-confirmation.html";
});
</script>

</body>
</html>
