<section class="section">
  <h2>Book a Vehicle</h2>
  <p>Please fill out the form below to submit your booking request. KLCRS will contact you to confirm your reservation.</p>

  <form id="bookingForm">
    <label>Full Name</label><br>
    <input type="text" id="name" required><br><br>

    <label>Phone Number</label><br>
    <input type="text" id="phone" required><br><br>

    <label>Email</label><br>
    <input type="email" id="email" required><br><br>

    <label>Select Vehicle</label><br>
    <select id="carId" required>
      <option value="ml320_2001">Mercedes-Benz ML 320 (2001)</option>
      <option value="prado_placeholder">Toyota Land Cruiser Prado</option>
      <option value="xtrail_placeholder">Nissan X-Trail</option>
    </select><br><br>

    <label>Rental Area</label><br>
    <select id="area" required>
      <option value="inland">Inland (Freetown–Waterloo) – €25/day</option>
      <option value="upland">Upland / Provinces – €56/day</option>
    </select><br><br>

    <label>Start Date</label><br>
    <input type="date" id="startDate" required><br><br>

    <label>End Date</label><br>
    <input type="date" id="endDate" required><br><br>

    <label>Will you provide your own driver?</label><br>
    <select id="ownDriver" required>
      <option value="no">No, use KLCRS driver</option>
      <option value="yes">
