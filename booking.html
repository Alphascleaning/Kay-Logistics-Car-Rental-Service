<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KLCRS – Booking</title>

  <link rel="stylesheet" href="assets/css/style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="assets/firebase.js"></script>
</head>
<body>
<header>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </nav>
</header>

<h1>Make a Booking</h1>

<form id="bookingForm">
  <input type="text" id="bkName" placeholder="Your name" required>
  <input type="email" id="bkEmail" placeholder="Your email" required>
  <input type="text" id="bkVehicle" placeholder="Vehicle" required>
  <input type="date" id="bkStart" required>
  <input type="date" id="bkEnd" required>
  <button type="submit">Submit Booking</button>
</form>

<script>
document.getElementById("bookingForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const customerName = document.getElementById("bkName").value;
  const customerEmail = document.getElementById("bkEmail").value;
  const vehicle = document.getElementById("bkVehicle").value;
  const startDate = document.getElementById("bkStart").value;
  const endDate = document.getElementById("bkEnd").value;

  try {
    await firestore.collection("bookings").add({
      customerName,
      customerEmail,
      vehicle,
      startDate,
      endDate,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    alert("Booking submitted.");
    window.location.href = "index.html";
  } catch (err) {
    alert("Booking error: " + err.message);
  }
});
</script>
</body>
</html>
