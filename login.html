<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – KLCRS</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- ⭐ Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <!-- ⭐ Firebase Config -->
    <script>
     const firebaseConfig = {
  apiKey: "AIzaSyBTGRBvq-QQUcSsufDadxJQVeyB5E0_UME",
  authDomain: "klcrs-a7054.firebaseapp.com",
  projectId: "klcrs-a7054",
  storageBucket: "klcrs-a7054.firebasestorage.app",
  messagingSenderId: "972485288867",
  appId: "1:972485288867:web:8616aba476cfd4997fb016"
};

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
    </script>

</head>

<body>

<h1>Login to KLCRS</h1>

<form id="loginForm">

    <label>Email:</label>
    <input type="email" id="logEmail" required>

    <label>Password:</label>
    <input type="password" id="logPassword" required>

    <button type="submit">Login</button>

</form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("logEmail").value;
    const password = document.getElementById("logPassword").value;

    try {
        // Login user
        const userCred = await auth.signInWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        // Fetch role from Firestore
        const doc = await db.collection("users").doc(uid).get();
        const data = doc.data();

        // Store role + email locally
        localStorage.setItem("klcrsUserRole", data.role);
        localStorage.setItem("klcrsUserEmail", data.email);

        alert("Logged in as " + data.role);

        // Redirect to homepage
        window.location.href = "index.html";

    } catch (err) {
        alert("Login error: " + err.message);
    }
});
</script>

</body>
</html>
