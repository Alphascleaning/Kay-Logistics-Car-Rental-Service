</head>

<body>

<h1>Login to KLCRS</h1>

<form id="loginForm">

    <label>Email:</label>
    <input type="email" id="logEmail" required>

    <label>Password:</label>
    <input type="password" id="logPassword" required>

    <button type="submit">Login</button>

</form>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {
    // Sign in user
    const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
    const user = userCredential.user;

    // Load user role from Firestore
    const docRef = firestore.collection("users").doc(user.uid);
    const docSnap = await docRef.get();

    if (!docSnap.exists) {
      alert("Error: User record not found.");
      return;
    }

    const userData = docSnap.data();
    const role = userData.role; // admin / worker / customer

    // Save role + email to localStorage
    localStorage.setItem("klcrsUserRole", role);
    localStorage.setItem("klcrsUserEmail", email);

    // Redirect based on role
    if (role === "admin" || role === "worker") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "index.html";
    }

  } catch (error) {
    alert("Login error: " + error.message);
  }
});
</script>


</body>
</html>
