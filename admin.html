<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – KLCRS</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
<header>
  <div class="logo">KLCRS Admin</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="fleet.html">Fleet</a>
    <a href="booking.html">Booking</a>
  </nav>
</header>

<section class="section">
  <h2>Admin Booking Dashboard</h2>
  <p>View and manage all incoming booking requests.</p>

  <div class="admin-table">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Vehicle</th>
          <th>Start Date</th>
          <th>End Date</th>
          <th>Driver</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="bookingData">
        <!-- Firebase entries will appear here -->
      </tbody>
    </table>
  </div>
</section>

<footer>
  © Kay Logistics Car Rental Service (KLCRS)
</footer>

<!-- Firebase Core Scripts -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script src="js/firebase.js"></script>

<!-- Admin Dashboard Firebase Loader -->
<script>
firestore.collection("bookings").orderBy("timestamp", "desc").onSnapshot(snapshot => {
  const table = document.getElementById("bookingData");
  table.innerHTML = "";

  snapshot.forEach(doc => {
    const b = doc.data();
    table.innerHTML += `
      <tr>
        <td>${b.name}</td>
        <td>${b.phone}</td>
        <td>${b.vehicle}</td>
        <td>${b.startDate}</td>
        <td>${b.endDate}</td>
        <td>${b.driver}</td>
        <td>Pending</td>
      </tr>
    `;
  });
});
</script>

</body>
</html>
