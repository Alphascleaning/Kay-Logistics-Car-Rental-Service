<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KLCRS – Worker Dashboard">

  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script src="assets/firebase.js"></script>
</head>

<body>

<header>
  <nav>
    <a href="index.html">Home</a>
    <button onclick="logoutUser()">Logout</button>
  </nav>
</header>

<h1>Worker Dashboard</h1>
<p>Worker/Admin access only.</p>

<table id="bookingTable" border="1">
  <thead>
    <tr>
      <th>Customer</th>
      <th>Email</th>
      <th>Vehicle</th>
      <th>Start</th>
      <th>End</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
// Role protection
document.addEventListener("DOMContentLoaded", async () => {
  const role = localStorage.getItem("klcrsUserRole");

  if (role !== "worker" && role !== "admin") {
    alert("Access denied. Worker/Admin only.");
    window.location.href = "login.html";
    return;
  }

  // Load all bookings
  const tbody = document.querySelector("#bookingTable tbody");
  const snap = await firestore.collection("bookings").orderBy("createdAt", "desc").get();

  snap.forEach(doc => {
    const b = doc.data();
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${b.customerName || ""}</td>
      <td>${b.customerEmail || ""}</td>
      <td>${b.vehicle || ""}</td>
      <td>${b.startDate || ""}</td>
      <td>${b.endDate || ""}</td>
    `;
    tbody.appendChild(tr);
  });
});

// Logout
function logoutUser() {
  auth.signOut();
  localStorage.clear();
  alert("Logged out.");
  window.location.href = "index.html";
}
</script>

</body>
</html>
