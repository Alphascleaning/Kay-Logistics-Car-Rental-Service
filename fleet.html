<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fleet – KLCRS</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- Admin Link Protection -->
  <script>
    function goAdmin() {
      const role = localStorage.getItem("klcrsUserRole");
      if (role !== "admin" && role !== "worker") {
        alert("Access denied. Admin / Worker only.");
        return;
      }
      window.location.href = "admin.html";
    }
  </script>

</head>

<body>

<header>
  <div class="logo">KLCRS</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="fleet.html">Fleet</a>
    <a href="booking.html">Booking</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="register.html">Sign Up</a>
    <a href="#" onclick="goAdmin()">Admin</a>
  </nav>
</header>

<h1>Our Fleet</h1>

<section class="fleet-section">

  <!-- Vehicle 1 -->
  <div class="vehicle-card">
    <h3>Mercedes-Benz ML 320</h3>
    <p>Strong SUV for inland and upland routes.</p>
    <button onclick="selectVehicle('ML 320')">Book Now</button>
  </div>

  <!-- Vehicle 2 -->
  <div class="vehicle-card">
    <h3>Toyota Land Cruiser Prado</h3>
    <p>Reliable jeep for long-distance travel.</p>
    <button onclick="selectVehicle('Prado')">Book Now</button>
  </div>

  <!-- Vehicle 3 -->
  <div class="vehicle-card">
    <h3>Nissan X-Trail</h3>
    <p>Comfortable and fuel-efficient.</p>
    <button onclick="selectVehicle('X-Trail')">Book Now</button>
  </div>

</section>

<script>
function selectVehicle(vehicleName) {
  const role = localStorage.getItem("klcrsUserRole");

  // If not logged in → redirect to signup
  if (!role || role !== "customer") {
    alert("Please sign up or log in as a customer to book a vehicle.");
    window.location.href = "register.html";
    return;
  }

  // Save selected vehicle
  localStorage.setItem("selectedVehicle", vehicleName);

  // Redirect to booking page
  window.location.href = "booking.html";
}
</script>

</body>
</html>
