  <meta charset="UTF-8">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
  apiKey: "AIzaSyBTGRBvq-QQUcSsufDadxJQVeyB5E0_UME",
  authDomain: "klcrs-a7054.firebaseapp.com",
  projectId: "klcrs-a7054",
  storageBucket: "klcrs-a7054.firebasestorage.app",
  messagingSenderId: "972485288867",
  appId: "1:972485288867:web:8616aba476cfd4997fb016"
};


    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
  </script>

  <!-- Logout Function -->
  <script>
    function logoutUser() {
      auth.signOut().then(() => {
        localStorage.removeItem("klcrsUserRole");
        localStorage.removeItem("klcrsUserEmail");
        alert("You have been logged out.");
        window.location.href = "index.html";
      });
    }
  </script>

  <!-- Admin Link Protection -->
  <script>
    function goAdmin() {
      const role = localStorage.getItem("klcrsUserRole");
      if (role !== "admin" && role !== "worker") {
        alert("Access denied. Admin / Worker only.");
        return;
      }
      window.location.href = "admin.html";
    }
  </script>

</head>

<body>

<header>
  <div class="logo">KLCRS</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="fleet.html">Fleet</a>
    <a href="booking.html">Booking</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="register.html">Sign Up</a>
    <a href="#" onclick="goAdmin()">Admin</a>
  </nav>
</header>

<!-- Full Login Bar -->
<div class="login-bar" style="padding:15px; background:#eef3ff; border-bottom:1px solid #ccc;">
  <form id="inlineLoginForm" style="display:flex; gap:10px; align-items:center;">
    <input type="email" id="inlineEmail" placeholder="Email" required style="padding:8px; width:200px;">
    <input type="password" id="inlinePassword" placeholder="Password" required style="padding:8px; width:200px;">
    <button type="submit" style="padding:8px 15px; background:#0047AB; color:white; border:none;">Login</button>
  </form>
</div>

<!-- Create Account Link -->
<div style="padding:10px;">
  <a href="register.html" style="color:#0047AB;">Create an account</a>
</div>

<!-- Logged-in user display -->
<div id="userStatus" style="padding:10px; font-size:14px; color:#0047AB;"></div>

<!-- Logout Button -->
<button onclick="logoutUser()" 
        style="padding:8px 15px; background:#0047AB; color:white; border:none; margin:10px;">
  Logout
</button>

<h1>Our Fleet</h1>

<section class="fleet-section" style="display:flex; gap:20px; padding:20px; flex-wrap:wrap;">

  <!-- Vehicle 1 -->
  <div class="vehicle-card" style="border:1px solid #ccc; padding:15px; width:280px;">
    <h3>Mercedes-Benz ML 320</h3>
    <img src="assets/img/ml320.jpg" alt="ML 320" style="width:100%; height:auto; margin-bottom:10px;">
    <p>Strong SUV for inland and upland routes.</p>
    <button onclick="selectVehicle('ML 320')">Book Now</button>
  </div>

  <!-- Vehicle 2 -->
  <div class="vehicle-card" style="border:1px solid #ccc; padding:15px; width:280px;">
    <h3>Toyota Land Cruiser Prado</h3>
    <img src="assets/img/prado.jpg" alt="Prado" style="width:100%; height:auto; margin-bottom:10px;">
    <p>Reliable jeep for long-distance travel.</p>
    <button onclick="selectVehicle('Prado')">Book Now</button>
  </div>

  <!-- Vehicle 3 -->
  <div class="vehicle-card" style="border:1px solid #ccc; padding:15px; width:280px;">
    <h3>Nissan X-Trail</h3>
    <img src="assets/img/xtrail.jpg" alt="X-Trail" style="width:100%; height:auto; margin-bottom:10px;">
    <p>Comfortable and fuel-efficient.</p>
    <button onclick="selectVehicle('X-Trail')">Book Now</button>
  </div>

</section>

<script>
function selectVehicle(vehicleName) {
  const role = localStorage.getItem("klcrsUserRole");

  // If not logged in → redirect to signup
  if (!role || role !== "customer") {
    alert("Please sign up or log in as a customer to book a vehicle.");
    window.location.href = "register.html";
    return;
  }

  // Save selected vehicle
  localStorage.setItem("selectedVehicle", vehicleName);

  // Redirect to booking page
  window.location.href = "booking.html";
}
</script>

</body>
</html>
