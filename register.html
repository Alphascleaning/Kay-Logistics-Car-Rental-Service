<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register – KLCRS</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <!-- ⭐ Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <!-- ⭐ Firebase Config -->
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBTGRBvq-QQUcSsufDadxJQVeyB5E0_UME",
  authDomain: "klcrs-a7054.firebaseapp.com",
  projectId: "klcrs-a7054",
  storageBucket: "klcrs-a7054.firebasestorage.app",
  messagingSenderId: "972485288867",
  appId: "1:972485288867:web:8616aba476cfd4997fb016"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
</script>


</head>

<body>

<header>
  <div class="logo">KLCRS</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="fleet.html">Fleet</a>
    <a href="booking.html">Booking</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>

<section class="section" style="max-width:500px; margin:auto;">
  <h1>Create Your KLCRS Account</h1>

  <form id="registerForm" style="display:flex; flex-direction:column; gap:15px;">

      <label>Email:</label>
      <input type="email" id="regEmail" required>

      <label>Password:</label>
      <input type="password" id="regPassword" required>

      <label>Select Role:</label>
      <select id="regRole" required>
          <option value="">Select Role</option>
          <option value="customer">Customer</option>
          <option value="worker">Worker</option>
          <option value="admin">Administrator</option>
      </select>

      <button type="submit" class="btn-primary">Create Account</button>
  </form>
</section>

<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("regEmail").value;
    const password = document.getElementById("regPassword").value;
    const role = document.getElementById("regRole").value;

    try {
        // Create user in Firebase Auth
        const userCred = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCred.user.uid;

        // Save role in Firestore
        await db.collection("users").doc(uid).set({
            email: email,
            role: role
        });

        // Save role locally
        localStorage.setItem("klcrsUserEmail", email);
        localStorage.setItem("klcrsUserRole", role);

        alert("Account created successfully as: " + role);

        // Redirect based on role
        if (role === "admin" || role === "worker") {
            window.location.href = "admin.html";
        } else {
            window.location.href = "booking.html";
        }

    } catch (err) {
        alert("Registration error: " + err.message);
    }
});
</script>

</body>
</html>
