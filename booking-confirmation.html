<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .header {
      background-color: #0047AB;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #000;
    }

    .header-title {
      font-size: 26px;
      font-weight: bold;
      color: black;
    }

    .fleet-logo {
      width: 180px;
      height: auto;
    }

    .agreement-number {
      font-size: 18px;
      font-weight: bold;
      margin-top: 15px;
      color: black;
    }

    .confirmation-box {
      border: 1px solid #ccc;
      padding: 15px;
      margin: 20px 0;
      border-radius: 6px;
      background: #fff;
    }

    .confirmation-box p {
      font-size: 16px;
      color: black;
    }

    .qr-box {
      text-align: right;
      margin-top: 30px;
    }

    .qr-code {
      width: 120px;
      height: auto;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">Kay Logistics Car Rental Service (KLCRS)</div>
    <img src="assets/img/klcrs-fleet.png" class="fleet-logo" alt="KLCRS Fleet Badge">
  </div>

  <!-- AGREEMENT NUMBER -->
  <div class="agreement-number">
    Agreement Number: <span id="agreementNumber"></span>
  </div>

  <!-- BOOKING DETAILS -->
  <div class="confirmation-box">
    <h2>Booking Details</h2>

    <p><strong>Name:</strong> <span id="name"></span></p>
    <p><strong>Phone:</strong> <span id="phone"></span></p>
    <p><strong>Email:</strong> <span id="email"></span></p>
    <p><strong>Vehicle:</strong> <span id="vehicle"></span></p>
    <p><strong>Location:</strong> <span id="location"></span></p>
    <p><strong>Daily Price:</strong> <span id="dailyPrice"></span></p>
    <p><strong>Total Price:</strong> <span id="totalPrice"></span></p>
    <p><strong>Start Date:</strong> <span id="startDate"></span></p>
    <p><strong>End Date:</strong> <span id="endDate"></span></p>
    <p><strong>Pickup Location:</strong> <span id="pickup"></span></p>
    <p><strong>Driver Option:</strong> <span id="driver"></span></p>
  </div>

  <!-- QR -->
  <div class="qr-box">
    <img src="assets/img/agreement-qr.png" class="qr-code" alt="Agreement QR Code">
    <p>Scan QR to verify agreement.</p>
  </div>
<!-- PDF DOWNLOAD BUTTON (STEP 2) -->
  <div style="margin-top: 20px;">
    <button class="btn" onclick="downloadPDF()">Download PDF</button>
  <div style="margin-top: 10px;">
  <button class="btn" onclick="cancelBooking()">Cancel Booking</button>  
  </div>
<script>
  // Generate agreement number
  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth() + 1).padStart(2, '0');
  const dd = String(today.getDate()).padStart(2, '0');
  const randomDigits = Math.floor(1000 + Math.random() * 9000);
  const agreementNumber = `RA-${yyyy}-${mm}-${dd}-${randomDigits}`;
  document.getElementById("agreementNumber").textContent = agreementNumber;

  // Load booking data from localStorage
  const booking = JSON.parse(localStorage.getItem("lastBooking"));

  document.getElementById("name").textContent = booking.name;
  document.getElementById("phone").textContent = booking.phone;
  document.getElementById("email").textContent = booking.email;
  document.getElementById("vehicle").textContent = booking.vehicle;
  document.getElementById("location").textContent = booking.location;
  document.getElementById("dailyPrice").textContent = booking.dailyPrice;
  document.getElementById("totalPrice").textContent = booking.totalPrice;
  document.getElementById("startDate").textContent = booking.startDate;
  document.getElementById("endDate").textContent = booking.endDate;
  document.getElementById("pickup").textContent = booking.pickup;
  document.getElementById("driver").textContent = booking.driver;
</script>
<script>
async function downloadPDF() {
  const { jsPDF } = window.jspdf;

  const element = document.body;

  const canvas = await html2canvas(element, { scale: 2 });

  const imgData = canvas.toDataURL("image/png");
  const pdf = new jsPDF("p", "mm", "a4");

  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

  pdf.addImage(imgData, "PNG", 0, 0, pdfWidth, pdfHeight);

  pdf.save("KLCRS_Rental_Agreement.pdf");
}
  <script>
function cancelBooking() {
  const booking = JSON.parse(localStorage.getItem("lastBooking"));
  if (!booking) return alert("No booking found.");

  const bookingDate = new Date(booking.startDate);
  const today = new Date();

  const diffTime = bookingDate - today;
  const diffDays = diffTime / (1000 * 60 * 60 * 24);

  if (diffDays >= 1) {
    // Free cancellation
    alert("Your booking has been cancelled. No fee applied (within 1-day grace period).");

  } else {
    // Administrative fee applies
    alert("Your booking has been cancelled. An administrative fee of €10 will be charged.");
  }

  // Remove last booking
  localStorage.removeItem("lastBooking");

  // Remove from allBookings
  let allBookings = JSON.parse(localStorage.getItem("allBookings")) || [];
  allBookings = allBookings.filter(b => b.startDate !== booking.startDate || b.name !== booking.name);
  localStorage.setItem("allBookings", JSON.stringify(allBookings));

  // Redirect to homepage
  window.location.href = "index.html";
}
</script>

</script>

</body>
</html>
