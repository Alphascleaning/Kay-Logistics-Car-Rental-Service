<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmation</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    .header {
      background-color: #0047AB;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid #000;
    }
    .header-title { font-size: 26px; font-weight: bold; color: black; }
    .fleet-logo { width: 180px; }
    .agreement-number { font-size: 18px; font-weight: bold; margin-top: 15px; }
    .confirmation-box { border: 1px solid #ccc; padding: 15px; margin: 20px 0; background: #fff; border-radius: 6px; }
    .btn { padding: 10px 18px; background:#0047AB; color:white; border:none; border-radius:6px; cursor:pointer; }
  </style>
</head>

<body>

<div class="header">
  <div class="header-title">Kay Logistics Car Rental Service (KLCRS)</div>
  <img src="assets/img/klcrs-fleet.png" class="fleet-logo">
</div>

<div class="agreement-number">
  Agreement Number: <span id="agreementNumber"></span>
</div>

<div class="confirmation-box">
  <h2>Booking Details</h2>

  <p><strong>Name:</strong> <span id="name"></span></p>
  <p><strong>Phone:</strong> <span id="phone"></span></p>
  <p><strong>Email:</strong> <span id="email"></span></p>
  <p><strong>Vehicle:</strong> <span id="vehicle"></span></p>
  <p><strong>Start Date:</strong> <span id="startDate"></span></p>
  <p><strong>End Date:</strong> <span id="endDate"></span></p>
  <p><strong>Pickup:</strong> <span id="pickup"></span></p>
  <p><strong>Driver:</strong> <span id="driver"></span></p>
</div>

<button class="btn" onclick="downloadPDF()">Download PDF</button>

<div style="margin-top:20px;">
  <label><strong>Reason for Cancellation:</strong></label>
  <select id="cancelReason" style="padding:10px;">
    <option value="">Select reason</option>
    <option value="Change of plans">Change of plans</option>
    <option value="Found cheaper option">Found cheaper option</option>
    <option value="Incorrect booking details">Incorrect booking details</option>
    <option value="Vehicle no longer needed">Vehicle no longer needed</option>
    <option value="Emergency situation">Emergency situation</option>
  </select>
</div>

<button class="btn" style="margin-top:10px;" onclick="cancelBooking()">Cancel Booking</button>

<script>
// Agreement number
const today = new Date();
const yyyy = today.getFullYear();
const mm = String(today.getMonth()+1).padStart(2,'0');
const dd = String(today.getDate()).padStart(2,'0');
const randomDigits = Math.floor(1000 + Math.random()*9000);
document.getElementById("agreementNumber").textContent = `RA-${yyyy}-${mm}-${dd}-${randomDigits}`;

// Load booking
const booking = JSON.parse(localStorage.getItem("lastBooking"));
document.getElementById("name").textContent = booking.name;
document.getElementById("phone").textContent = booking.phone;
document.getElementById("email").textContent = booking.email;
document.getElementById("vehicle").textContent = booking.vehicle;
document.getElementById("startDate").textContent = booking.startDate;
document.getElementById("endDate").textContent = booking.endDate;
document.getElementById("pickup").textContent = booking.pickup;
document.getElementById("driver").textContent = booking.driver;
</script>

<script>
async function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const canvas = await html2canvas(document.body, { scale:2 });
  const imgData = canvas.toDataURL("image/png");
  const pdf = new jsPDF("p","mm","a4");
  const pdfWidth = pdf.internal.pageSize.getWidth();
  const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
  pdf.addImage(imgData,"PNG",0,0,pdfWidth,pdfHeight);
  pdf.save("KLCRS_Rental_Agreement.pdf");
}
</script>

<script>
function cancelBooking() {
  const reason = document.getElementById("cancelReason").value;
  if (!reason) return alert("Please select a cancellation reason.");

  const bookingDate = new Date(booking.startDate);
  const today = new Date();
  const diffDays = (bookingDate - today) / (1000*60*60*24);

  let fee = diffDays >= 1 ? 0 : 10;

  alert(`Booking cancelled.\nReason: ${reason}\nFee: €${fee}`);

  // Free booked dates
  let availability = JSON.parse(localStorage.getItem("availability")) || {};
  if (availability[booking.vehicle]) {
    const start = new Date(booking.startDate);
    const end = new Date(booking.endDate);

    for (let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) {
      const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      availability[booking.vehicle] = availability[booking.vehicle].filter(date => date !== dateStr);
    }
  }
  localStorage.setItem("availability", JSON.stringify(availability));

  // Remove from allBookings
  let allBookings = JSON.parse(localStorage.getItem("allBookings")) || [];
  allBookings = allBookings.filter(b => !(b.name === booking.name && b.startDate === booking.startDate));
  localStorage.setItem("allBookings", JSON.stringify(allBookings));

  // Remove lastBooking
  localStorage.removeItem("lastBooking");

  window.location.href = "index.html";
}
</script>

</body>
</html>
